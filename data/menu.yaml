# Menu strony - edytowane w panelu /admin/ (kolekcja "Menu").
# "strona" to slug podstrony z content/strony/<slug>/index.md.
# Pozycja wskazujaca nieistniejaca strone = blad budowania (strona w sieci sie
# nie zmienia, w repozytorium powstaje zgloszenie). Strona ukryta (draft)
# znika z menu sama. Odnosnik do strony glownej ("Start") dodaje szablon.
#   pozycje       - menu glowne (dwa poziomy: pozycje i podmenu)
#   dodatkowe     - pozycje dopisywane za menu glownym tam, gdzie jest miejsce
#                   (w v1-klasyczna: menu na telefonie)
#   stopka        - lista stron w stopce (pusta = pozycje menu bez podmenu)
#   stopka_dolna  - odnosniki w dolnej linii stopki (pusta = polityka prywatnosci)
