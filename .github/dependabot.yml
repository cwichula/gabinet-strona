# Aktualizacje akcji GitHub w .github/workflows/ (przypietych do SHA commita):
# Dependabot otwiera pull request z nowym SHA i numerem wersji w komentarzu.
# Oraz pakietow Pythona dla narzedzi z tools/ (tools/requirements.txt).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      akcje:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
