# Budowanie, kontrola i publikacja strony na GitHub Pages (Hugo).
#
# Kazdy commit na main - takze zapis w panelu /admin/ (Sveltia CMS commituje
# przez API GitHuba jako zalogowana osoba, co uruchamia "on: push") - przechodzi:
#   1. kontrole kontraktu blokow (tools/sprawdz-kontrakt.py: pusty layouts/,
#      partial dla kazdego typu bloku w kazdym szablonie, pola zgodne z kontraktem),
#   2. budowanie Hugo (wersja przypieta ponizej) - BLAD albo OSTRZEZENIE
#      (np. nieznany typ bloku, menu wskazujace nieistniejaca strone, zdjecie
#      bez alt) przerywa przebieg,
#   3. kontrole kompletnosci wyniku (strona glowna, panel /admin/),
#   4. kontrole jakosci i zgodnosci zbudowanego HTML (tools/kontrola-strony.py:
#      jeden h1, alt/width/height zdjec, linki wewnetrzne z prefiksem adresu,
#      zadnych zasobow z obcych serwerow ani ramek bez zgody, JSON-LD i FAQ,
#      zwroty niedozwolone w materialach gabinetu - art. 14 ustawy
#      o dzialalnosci leczniczej, rezerwacja online).
# Dopiero wtedy publikacja. Blad = w sieci zostaje poprzednia wersja, a w
# repozytorium powstaje zgloszenie (job "powiadomienie").
#
# Wymaga w ustawieniach repozytorium: Settings -> Pages -> Source: GitHub Actions
# (gh api -X POST repos/<wlasciciel>/<repo>/pages -f build_type=workflow).

name: Strona (budowanie, kontrola, GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# jedna publikacja naraz; kolejne commity czekaja (nie przerywamy trwajacej)
concurrency:
  group: pages
  cancel-in-progress: false

# Wszystkie kroki "run" przez bash z -eo pipefail (bez "shell" GitHub uzywa
# "bash -e" BEZ pipefail - wtedy "hugo | tee" zwracaloby kod tee, czyli 0,
# i strona z bledami budowania trafilaby do sieci).
defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: "0.167.0"
  TZ: Europe/Warsaw
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Kontrola kontraktu bloków
        run: |
          python -m pip install --quiet "PyYAML==6.0.3"
          python tools/sprawdz-kontrakt.py

      - name: Instalacja Hugo Extended ${{ env.HUGO_VERSION }}
        run: |
          plik="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          adres="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$adres/$plik"
          curl -fsSLO "$adres/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $plik\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo-bin
          tar -xzf "$plik" -C hugo-bin
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Budowanie strony (Hugo)
        env:
          # kopia robocza na github.io: zawsze noindex (hugo.yaml: params.robocza)
          HUGO_PARAMS_ROBOCZA: "true"
        run: |
          hugo version
          # Ostrzezenia Hugo (warnf w szablonach, przestarzale opcje) traktujemy
          # jak bledy - ale wypisujemy wszystkie, a nie tylko pierwszy
          # (--panicOnWarning konczy na pierwszym, ze sladem stosu).
          # pipefail (defaults wyzej): blad Hugo (ERROR) konczy krok kodem != 0
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 2>&1 | tee hugo.log
          if grep -qE '^(WARN|ERROR)' hugo.log; then
            echo "::error::Hugo zgłosił błędy lub ostrzeżenia (lista wyżej, wiersze ERROR/WARN). Strona nie zostanie opublikowana."
            exit 1
          fi

      - name: Kontrola wyniku
        run: |
          for plik in index.html 404.html sitemap.xml admin/index.html admin/config.yml admin/sveltia-cms.js; do
            test -s "public/$plik" || { echo "::error::Brak public/$plik"; exit 1; }
          done
          echo "Plików w public/: $(find public -type f | wc -l)"

      - name: Kontrola jakości i zgodności (zwroty niedozwolone, linki, zasoby)
        run: |
          # BLAD (x) przerywa publikacje; UWAGI (-) i zestawienie wagi stron
          # sa w logu do przeczytania przez czlowieka.
          python tools/kontrola-strony.py public --baseurl "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # --- Wersja na wlasna domene (hosting) -------------------------------
      # Tylko gdy w Settings -> Secrets and variables -> Actions -> Variables
      # jest HOSTING_SERWER (opis w README, "Hosting na własnej domenie").
      # Ta sama tresc, inny adres bazowy; bez panelu /admin/ (panel zostaje
      # na github.io - tam dziala logowanie), z .htaccess z katalogu hosting/.
      # O widocznosci w Google decyduje ustawienie w panelu ("Ukryj strone
      # przed wyszukiwarkami"), nie ten krok.
      - name: Budowanie wersji na domenę
        if: vars.HOSTING_SERWER != ''
        env:
          ADRES: ${{ vars.HOSTING_ADRES || 'https://dobrydentysta.legnica.pl/' }}
        run: |
          hugo --gc --minify --baseURL "$ADRES" -d public-hosting 2>&1 | tee hugo-hosting.log
          if grep -qE '^(WARN|ERROR)' hugo-hosting.log; then
            echo "::error::Hugo zgłosił błędy lub ostrzeżenia przy wersji na domenę."
            exit 1
          fi
          python tools/kontrola-strony.py public-hosting --baseurl "$ADRES"
          rm -rf public-hosting/admin
          cp hosting/.htaccess public-hosting/.htaccess
          # zaden adres kopii roboczej nie moze trafic na domene
          if grep -rl --include='*.html' --include='*.xml' --include='*.txt' 'github\.io' public-hosting; then
            echo "::error::Wersja na domenę odwołuje się do github.io (pliki wyżej)."
            exit 1
          fi

      - name: Artefakt wersji na domenę
        if: vars.HOSTING_SERWER != ''
        uses: actions/upload-artifact@v7
        with:
          name: strona-hosting
          path: public-hosting
          include-hidden-files: true   # .htaccess
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Publikacja na GitHub Pages
        uses: actions/deploy-pages@v5

  # Wysylka wersji na domene na hosting przez SFTP albo FTPS (lftp mirror).
  # Zmienne (Variables): HOSTING_SERWER, HOSTING_PROTOKOL (sftp|ftps),
  # HOSTING_KATALOG (np. public_html), opcjonalnie HOSTING_PORT, HOSTING_ADRES,
  # HOSTING_SSH_KNOWN_HOSTS (wiersz known_hosts serwera SFTP).
  # Sekrety (Secrets): HOSTING_UZYTKOWNIK, HOSTING_HASLO.
  #
  # Usuwanie starych plikow (--delete) dopiero, gdy w katalogu docelowym lezy
  # znacznik .gabinet-strona, czyli katalog zostal zalozony przez ten workflow.
  # Pierwsza wysylka tylko dodaje i nadpisuje - nic, co juz bylo na serwerze
  # (np. pliki hostingu, poczta w zle wskazanym katalogu), nie zostanie skasowane.
  hosting:
    needs: build
    if: vars.HOSTING_SERWER != ''
    runs-on: ubuntu-latest
    environment:
      name: hosting
      url: ${{ vars.HOSTING_ADRES || 'https://dobrydentysta.legnica.pl/' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: strona-hosting
          path: public-hosting

      - name: Instalacja lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wysyłka na hosting
        env:
          PROTOKOL: ${{ vars.HOSTING_PROTOKOL }}
          SERWER: ${{ vars.HOSTING_SERWER }}
          PORT: ${{ vars.HOSTING_PORT }}
          KATALOG: ${{ vars.HOSTING_KATALOG }}
          ZNANY_HOST: ${{ vars.HOSTING_SSH_KNOWN_HOSTS }}
          UZYTKOWNIK: ${{ secrets.HOSTING_UZYTKOWNIK }}
          LFTP_PASSWORD: ${{ secrets.HOSTING_HASLO }}
        run: |
          test -s public-hosting/index.html && test -s public-hosting/.htaccess \
            || { echo "::error::Niekompletna wersja na domenę (brak index.html lub .htaccess)."; exit 1; }
          test -n "$UZYTKOWNIK" && test -n "$LFTP_PASSWORD" \
            || { echo "::error::Brak sekretów HOSTING_UZYTKOWNIK / HOSTING_HASLO."; exit 1; }
          case "$KATALOG" in
            ""|"/"|"."|"~"|"./")
              echo "::error::HOSTING_KATALOG musi wskazywać katalog strony (np. public_html), nie katalog główny konta."
              exit 1 ;;
          esac
          case "$PROTOKOL" in
            sftp)
              adres="sftp://$SERWER${PORT:+:$PORT}"
              ustawienia="set sftp:auto-confirm no;"
              mkdir -p ~/.ssh
              if [ -n "$ZNANY_HOST" ]; then
                printf '%s\n' "$ZNANY_HOST" >> ~/.ssh/known_hosts
              else
                echo "::warning::Brak HOSTING_SSH_KNOWN_HOSTS - klucz serwera pobrany bez weryfikacji (ssh-keyscan)."
                ssh-keyscan -p "${PORT:-22}" "$SERWER" >> ~/.ssh/known_hosts 2>/dev/null
              fi ;;
            ftps)
              adres="ftp://$SERWER${PORT:+:$PORT}"
              ustawienia="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;" ;;
            *)
              echo "::error::HOSTING_PROTOKOL musi być sftp albo ftps (zwykły FTP wysyła hasło jawnym tekstem)."
              exit 1 ;;
          esac
          polacz="set net:max-retries 3; set net:timeout 30; $ustawienia open --env-password -u \"$UZYTKOWNIK\" \"$adres\""

          lftp -c "$polacz; cd \"$KATALOG\"" \
            || { echo "::error::Nie mogę wejść do katalogu $KATALOG na serwerze $SERWER."; exit 1; }
          if lftp -c "$polacz; cd \"$KATALOG\"; cls -1a" | grep -qx '\.gabinet-strona'; then
            usun="--delete"
          else
            usun=""
            echo "::notice::Pierwsza wysyłka do $KATALOG - bez usuwania plików z serwera."
          fi

          lftp -c "$polacz; mirror --reverse $usun --verbose --parallel=4 \
            --exclude-glob .well-known/ --exclude-glob cgi-bin/ \
            --exclude-glob .gabinet-strona --exclude-glob .user.ini --exclude-glob .ftpquota \
            public-hosting/ \"$KATALOG\""

          printf 'Katalog strony zarządzany przez GitHub Actions (repozytorium gabinet-strona).\n' > .gabinet-strona
          lftp -c "$polacz; put -O \"$KATALOG\" .gabinet-strona"

  # Nieudany przebieg po zapisie w panelu nie trafia do niczyjej skrzynki
  # (GitHub powiadamia tylko autora przebiegu, a ten moze nie czytac maili
  # z Actions). Zgloszenie (issue) dostaje e-mailem kazdy obserwujacy repozytorium.
  # Jedno otwarte zgloszenie naraz: kolejne bledy dopisuja sie jako komentarze.
  powiadomienie:
    needs: [build, deploy, hosting]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Zgłoszenie o nieopublikowanej zmianie
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TYTUL: "Strona nie została opublikowana (błąd budowania lub kontroli)"
          PRZEBIEG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          # tresc commita tylko przez zmienna srodowiskowa - nigdy wprost w skrypcie
          WIADOMOSC: ${{ github.event.head_commit.message }}
          AUTOR: ${{ github.event.head_commit.author.name }}
        run: |
          tresc="$(printf '%s\n\n%s\n\n%s' \
            "Zmiana ${COMMIT:0:7} (${AUTOR:-uruchomienie ręczne}): ${WIADOMOSC:-}" \
            "Log z opisem błędu (szukaj wierszy ERROR, WARN albo BŁĄD): $PRZEBIEG" \
            "W sieci została poprzednia wersja strony. Po poprawce (w panelu /admin/ albo w kodzie) kolejny udany przebieg opublikuje stronę. Zamknij to zgłoszenie po naprawie.")"
          nr="$(gh issue list --state open --limit 100 --json number,title --jq 'map(select(.title == env.TYTUL))[0].number // empty')"
          if [ -n "$nr" ]; then
            gh issue comment "$nr" --body "$tresc"
          else
            gh issue create --title "$TYTUL" --body "$tresc"
          fi
