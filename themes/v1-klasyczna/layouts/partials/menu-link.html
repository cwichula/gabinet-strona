{{- /* Odnosnik pozycji menu (naglowek, menu mobilne, stopka).
       Wejscie: dict "pozycja" (pozycja z menu-model / menu-lista: href, etykieta,
       zewnetrzny), "aktywna" (bool - aria-current="page"). */ -}}
{{- with .pozycja -}}
<a href="{{ .href }}"{{ if $.aktywna }} aria-current="page"{{ end }}{{ if .zewnetrzny }} rel="noopener external"{{ end }}>{{ .etykieta }}</a>
{{- end -}}
