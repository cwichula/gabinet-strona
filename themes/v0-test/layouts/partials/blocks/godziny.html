{{- /* Blok "godziny": naglowek, tresc; godziny z data/gabinet.yaml. */ -}}
{{- $b := .blok -}}
<section {{ partial "blok-atrybuty.html" $b }}>
  <h2>{{ $b.naglowek | default "Godziny przyjęć" }}</h2>
  {{ partial "godziny-tabela.html" (dict "podpis" "") }}
  {{- with $b.tresc }}{{ partial "markdown.html" (dict "strona" $.strona "tekst" .) }}{{ end }}
</section>
