{{- /* Blok "faq": naglowek, elementy [{pytanie, odpowiedz}]. Bez JS (details/summary). */ -}}
{{- $b := .blok -}}
<section {{ partial "blok-atrybuty.html" $b }}>
  <h2>{{ $b.naglowek | default "Najczęstsze pytania" }}</h2>
  {{- range $b.elementy }}
  <details>
    <summary>{{ .pytanie }}</summary>
    <div class="odpowiedz">{{ partial "markdown.html" (dict "strona" $.strona "tekst" .odpowiedz) }}</div>
  </details>
  {{- end }}
</section>
