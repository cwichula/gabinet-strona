{{- /* Blok "faq": naglowek, elementy [{pytanie, odpowiedz}]. Bez JS (details/summary). */ -}}
{{- $b := .blok -}}
<section class="{{ partial "blok-klasy.html" $b }}">
  <h2>{{ $b.naglowek | default "Najczęstsze pytania" }}</h2>
  {{- range $b.elementy }}
  <details>
    <summary>{{ .pytanie }}</summary>
    <div class="odpowiedz">{{ $.strona.RenderString (dict "display" "block") .odpowiedz }}</div>
  </details>
  {{- end }}
</section>
