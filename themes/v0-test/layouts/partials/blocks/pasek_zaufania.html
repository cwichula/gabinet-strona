{{- /* Blok "pasek_zaufania": naglowek, elementy [{ikona (pomijana), tytul, tekst}]. */ -}}
{{- $b := .blok -}}
<section {{ partial "blok-atrybuty.html" $b }}>
  {{- with $b.naglowek }}
  <h2>{{ . }}</h2>
  {{- end }}
  <ul class="atuty">
    {{- range $b.elementy }}
    <li><strong>{{ .tytul }}</strong>{{ with .tekst }} — {{ . }}{{ end }}</li>
    {{- end }}
  </ul>
</section>
