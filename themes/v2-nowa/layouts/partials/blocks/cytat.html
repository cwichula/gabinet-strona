{{- /* Blok "cytat": tekst, autor - <blockquote> w kroju naglowkow od osi (dluzszy
       cytat - stopien wstepu), autor w <cite> po polpauzie. Cudzyslowy
       z tresci zostaja, bez ozdobnych duzych znakow. */ -}}
{{- $b := .blok -}}
{{- $dlugi := gt (strings.RuneCount ($b.tekst | default "")) 160 -}}
    <div class="blok cytat-blok">
      <figure class="os cytat{{ if $dlugi }} cytat--dlugi{{ end }}" data-wejscie>
        <blockquote>
          <p>{{ partial "tekst-wiersze.html" $b.tekst }}</p>
        </blockquote>
        {{- with $b.autor }}
        <figcaption>&ndash;&nbsp;<cite>{{ . }}</cite></figcaption>
        {{- end }}
      </figure>
    </div>
