# Konfiguracja Hugo (Hugo Extended, wersja przypieta w .github/workflows/pages.yml).
#
# Zmiana szablonu = zmiana jednej linii "theme". Tresc (content/, data/) jest
# wspolna dla wszystkich szablonow - patrz docs/KONTRAKT-BLOKOW.md.
# Katalog layouts/ w korzeniu repozytorium MUSI zostac pusty (nadpisalby
# kazdy szablon) - pilnuje tego CI.

baseURL: https://cwichula.github.io/gabinet-strona/
title: Gabinet stomatologiczny Dorota Rożdżestwieńska
theme: v1-klasyczna

# Jezyk strony. "locale" zastapilo "languageCode" (Hugo 0.158+; stary klucz
# daje ostrzezenie, a CI traktuje ostrzezenia jak bledy).
locale: pl
defaultContentLanguage: pl

# Usuwa akcenty z adresow ("ż" -> "z", "ó" -> "o"...), ale NIE zamienia "ł".
# Nazwy katalogow w content/strony/ musza byc z [a-z0-9-] - pilnuje tego
# tools/sprawdz-kontrakt.py (CMS sam zapisuje slugi bez ogonkow).
removePathAccents: true

# Tylko to, czego uzywamy: bez tagow/kategorii i bez RSS.
disableKinds: [taxonomy, term, rss]
enableRobotsTXT: true

# content/strony/<slug>/index.md -> /<slug>/
# :contentbasename dla paczki strony (leaf bundle) to nazwa jej katalogu,
# czyli ten sam slug, ktory Sveltia CMS nadaje wpisowi (panel "Slug").
# Jedno zrodlo prawdy: zmiana nazwy w CMS przenosi katalog, zmienia adres
# i dopisuje stary adres do "aliases" (przekierowanie).
permalinks:
  page:
    strony: /:contentbasename/

markup:
  goldmark:
    # Bez automatycznych id przy naglowkach z tresci (### ...): nie sa nigdzie
    # uzywane, a te same naglowki w dwoch blokach dawalyby powtorzone id.
    parser:
      autoHeadingID: false
    # ==tekst== -> <mark> (wyrozniony napis, np. "DO UZUPELNIENIA"; szablon
    # rysuje go jako plakietke).
    extensions:
      extras:
        mark:
          enable: true
    renderer:
      # Zadnego surowego HTML z tresci (pola Markdown z CMS). Pominiety HTML
      # nie blokuje publikacji (ignoreLogs nizej); <br> zamienia sie wczesniej
      # na zwykle zlamanie wiersza (partial markdown.html).
      unsafe: false

# Ostrzezenie "Raw HTML omitted" (np. <br> wklejone w tresc) nie przerywa CI.
ignoreLogs: ['warning-goldmark-raw-html']

imaging:
  # Zdjecia z CMS przychodza juz jako WebP <= 2048 px; Hugo zmniejsza je
  # do szerokosci 480/800/1200 px i zapisuje jako WebP (partial zdjecie-zasob.html
  # + image.html szablonu v1-klasyczna).
  resampleFilter: lanczos
  anchor: smart
  webp:
    quality: 80
    hint: photo
  jpeg:
    quality: 80

# Ograniczenia bezpieczenstwa: zadnych zewnetrznych programow ani pobierania
# danych z sieci podczas budowania.
security:
  enableInlineShortcodes: false
  exec:
    allow: ['^git$']
  funcs:
    getenv: ['^HUGO_', '^CI$']
  http:
    methods: ['(?i)GET']
    urls: ['none']

sitemap:
  changeFreq: monthly

params:
  # Wersja kontraktu blokow (docs/KONTRAKT-BLOKOW.md).
  kontraktBlokow: 3
  # Kopia robocza (GitHub Pages): zawsze noindex i "Disallow: /", niezaleznie
  # od ustawienia w panelu. Wlacza ja workflow zmienna HUGO_PARAMS_ROBOCZA=true;
  # build na wlasna domene (hosting) jej nie ustawia.
  robocza: false
